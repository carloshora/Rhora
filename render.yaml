version: "1.0"
graph:
  name: "Jornada do Usuário - Rhora.ai"
  type: "flowchart"
  nodes:
    - id: "start"
      label: "Recebe Ligação da IA"
      type: "start"
    
    - id: "qualificacao"
      label: "Qualificação e Interesse"
      type: "process"
    
    - id: "simulacao"
      label: "Simulação de Crédito"
      type: "process"
    
    - id: "formalizacao"
      label: "Formalização e Consentimento"
      type: "decision"
    
    - id: "assinatura"
      label: "Assinatura Digital"
      type: "process"
    
    - id: "confirmacao"
      label: "Confirmação e Pós-Venda"
      type: "end"

  edges:
    - from: "start"
      to: "qualificacao"
      label: "Cliente atende a chamada"
    
    - from: "qualificacao"
      to: "simulacao"
      label: "Lead qualificado"
    
    - from: "simulacao"
      to: "formalizacao"
      label: "Cliente recebe proposta"
    
    - from: "formalizacao"
      to: "assinatura"
      label: "Consentimento dado"
    
    - from: "assinatura"
      to: "confirmacao"
      label: "Contrato assinado"
